name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: property_app_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci
    - name: Create test environment file
      run: |
        cd backend
        cat > .env << EOF
        NODE_ENV=test
        JWT_SECRET=test-jwt-secret-key-for-ci-cd-pipeline
        MYSQL_HOST=127.0.0.1
        MYSQL_PORT=3306
        MYSQL_DB=property_app_test
        MYSQL_USER=testuser
        MYSQL_PASSWORD=testpass
        REDIS_HOST=127.0.0.1
        REDIS_PORT=6379
        ADMIN_EMAIL=admin@propertyvalue.com
        ADMIN_PASSWORD=admin123
        FRONTEND_URL=http://localhost:3000
        EOF
    - name: Wait for MySQL
      run: |
        for i in {1..30}; do
          if mysqladmin ping -h127.0.0.1 -P3306 -utestuser -ptestpass --silent; then
            echo "MySQL is ready"
            break
          fi
          echo "Waiting for MySQL..."
          sleep 2
        done
    - name: Run backend tests
      run: |
        cd backend
        npm test -- --coverage --watchAll=false
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        directory: ./backend/coverage
        flags: backend
        name: backend-coverage

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    - name: Run frontend tests
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false --passWithNoTests
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        directory: ./frontend/coverage
        flags: frontend
        name: frontend-coverage

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Validate Docker credentials
      id: docker-meta
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        echo "Validating Docker credentials..."
        SANITIZED_DOCKER_USERNAME="$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]' | xargs)"

        if [ -z "$SANITIZED_DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
          echo "push_enabled=false" >> "$GITHUB_OUTPUT"
          echo "docker_namespace=" >> "$GITHUB_OUTPUT"
          echo "Docker credentials missing or empty. Image push will be skipped."
        elif [[ ! "$SANITIZED_DOCKER_USERNAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
          echo "push_enabled=false" >> "$GITHUB_OUTPUT"
          echo "docker_namespace=" >> "$GITHUB_OUTPUT"
          echo "Warning: Docker username '$SANITIZED_DOCKER_USERNAME' is not a valid Docker Hub namespace."
          echo "Image push will be skipped to avoid invalid image tags."
        else
          echo "push_enabled=true" >> "$GITHUB_OUTPUT"
          echo "docker_namespace=$SANITIZED_DOCKER_USERNAME" >> "$GITHUB_OUTPUT"
          echo "Docker username format appears valid."
          echo "Credentials provided - will attempt to push to Docker Hub."
        fi
    - name: Log in to Docker Hub
      if: ${{ steps.docker-meta.outputs.push_enabled == 'true' }}
      env:
        DOCKER_USERNAME: ${{ steps.docker-meta.outputs.docker_namespace }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - name: Set image tags
      id: tags
      run: |
        if [ "${{ steps.docker-meta.outputs.push_enabled }}" = "true" ]; then
          DOCKER_NAMESPACE="${{ steps.docker-meta.outputs.docker_namespace }}"
          echo "backend_tags=$DOCKER_NAMESPACE/property-backend:latest,$DOCKER_NAMESPACE/property-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend_tags=$DOCKER_NAMESPACE/property-frontend:latest,$DOCKER_NAMESPACE/property-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT
        else
          echo "backend_tags=property-backend:latest,property-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend_tags=property-frontend:latest,property-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT
        fi
    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: ${{ steps.docker-meta.outputs.push_enabled == 'true' }}
        tags: ${{ steps.tags.outputs.backend_tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: ${{ steps.docker-meta.outputs.push_enabled == 'true' }}
        tags: ${{ steps.tags.outputs.frontend_tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set deployment environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DEPLOY_ENV=${{ inputs.environment }}" >> $GITHUB_ENV
            echo "deploy_env=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "DEPLOY_ENV=production" >> $GITHUB_ENV
            echo "deploy_env=production" >> $GITHUB_OUTPUT
          fi
      - name: Verify Docker images exist
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "Docker images should be available in registry"
            echo "Backend: $DOCKER_USERNAME/property-backend:latest"
            echo "Frontend: $DOCKER_USERNAME/property-frontend:latest"
          else
            echo "Docker images built locally (not pushed to registry)"
          fi
      - name: Deploy to environment
        run: |
          echo "Deploying to ${{ steps.set-env.outputs.deploy_env }} environment"
          if [ "${{ steps.set-env.outputs.deploy_env }}" = "production" ] || [ "${{ steps.set-env.outputs.deploy_env }}" = "staging" ]; then
            echo "Deploying to Kubernetes cluster using kubectl..."
            # Example: kubectl apply -f k8s/
            kubectl version --client
            kubectl apply -f k8s/
          else
            echo "Deploying locally using docker-compose..."
            docker compose version
            docker compose -f docker-compose.yml up -d --build
          fi