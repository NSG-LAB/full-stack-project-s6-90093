name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: property_app_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: |
        cd backend
        npm ci

    - name: Create test environment file
      run: |
        cd backend
        cat > .env << EOF
        NODE_ENV=test
        JWT_SECRET=test-jwt-secret-key-for-ci-cd-pipeline
        MYSQL_HOST=127.0.0.1
        MYSQL_PORT=3306
        MYSQL_DB=property_app_test
        MYSQL_USER=testuser
        MYSQL_PASSWORD=testpass
        REDIS_HOST=127.0.0.1
        REDIS_PORT=6379
        ADMIN_EMAIL=admin@propertyvalue.com
        ADMIN_PASSWORD=admin123
        FRONTEND_URL=http://localhost:3000
        EOF

    - name: Wait for MySQL
      run: |
        for i in {1..30}; do
          if mysqladmin ping -h127.0.0.1 -P3306 -utestuser -ptestpass --silent; then
            echo "MySQL is ready"
            break
          fi
          echo "Waiting for MySQL..."
          sleep 2
        done

    - name: Run backend tests
      run: |
        cd backend
        npm test -- --coverage --watchAll=false

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        directory: ./backend/coverage
        flags: backend
        name: backend-coverage

  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run frontend tests
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false --passWithNoTests

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        directory: ./frontend/coverage
        flags: frontend
        name: frontend-coverage

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (vars.ENABLE_DOCKER_BUILD == 'true' || github.event_name == 'workflow_dispatch')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Validate Docker credentials
      if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
      run: |
        echo "Validating Docker credentials..."
        if [[ ! "$DOCKER_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
          echo "Warning: Docker username '$DOCKER_USERNAME' contains characters that may not be valid for Docker Hub."
          echo "Docker Hub usernames should only contain letters, numbers, dots, underscores, and hyphens."
        else
          echo "Docker username format appears valid."
        fi
        echo "Credentials provided - will attempt to push to Docker Hub."

    - name: Log in to Docker Hub
      if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Set image tags
      id: tags
      run: |
        if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
          echo "backend_tags=$DOCKER_USERNAME/property-backend:latest,$DOCKER_USERNAME/property-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend_tags=$DOCKER_USERNAME/property-frontend:latest,$DOCKER_USERNAME/property-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT
        else
          echo "backend_tags=property-backend:latest,property-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend_tags=property-frontend:latest,property-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT
        fi

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        tags: ${{ steps.tags.outputs.backend_tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        tags: ${{ steps.tags.outputs.frontend_tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_DEPLOY == 'true') || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set deployment environment
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "DEPLOY_ENV=${{ inputs.environment }}" >> $GITHUB_ENV
        else
          echo "DEPLOY_ENV=production" >> $GITHUB_ENV
        fi

    - name: Verify Docker images exist
      run: |
        if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
          echo "Docker images should be available in registry"
          echo "Backend: $DOCKER_USERNAME/property-backend:latest"
          echo "Frontend: $DOCKER_USERNAME/property-frontend:latest"
        else
          echo "Docker images built locally (not pushed to registry)"
        fi

    - name: Deploy to ${{ env.DEPLOY_ENV }}
      run: |
        echo "Deploying to ${{ env.DEPLOY_ENV }} environment"
        echo "Deployment would happen here based on environment: ${{ env.DEPLOY_ENV }}"
        echo "This could trigger a webhook to your deployment platform"
        echo "Or use kubectl to deploy to Kubernetes"
        echo "Or use docker-compose for local deployment"